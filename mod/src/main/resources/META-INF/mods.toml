在游戏里开一个本地控制端口（动态服务），把「往前走」这类动作暴露成换行分隔的 JSON 包，
由 tools/mcmcp.py 的 MCP 服务转发给 AI 代理。
'''

[[dependencies.mcpforminecraft]]
